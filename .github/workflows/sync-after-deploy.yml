name: Sync Sheet after Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deploy (only on push)
        if: github.event_name == 'push'
        run: sleep 60

      - name: Trigger Google Sheet sync
        run: curl -s https://siam-royal.pages.dev/api/sync
